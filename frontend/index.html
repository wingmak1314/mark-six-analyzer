<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六合彩數據分析</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e8e8e8; padding: 20px; }
h1 { font-size: 24px; margin-bottom: 4px; }
.sub { color: #888; font-size: 13px; margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.card { background: #1a1d27; border: 1px solid #2a2e3d; border-radius: 10px; padding: 16px; }
.card h2 { font-size: 15px; color: #ffd700; margin-bottom: 12px; border-bottom: 1px solid #2a2e3d; padding-bottom: 8px; }
.ball { display: inline-flex; width: 34px; height: 34px; border-radius: 50%; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; margin: 2px; }
.ball-red { background: #e63946; color: #fff; }
.ball-blue { background: #1d6fb8; color: #fff; }
.ball-sp { background: #ffd700; color: #111; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 4px 6px; text-align: center; border-bottom: 1px solid #22263a; }
th { color: #888; font-weight: 500; }
.bar { height: 6px; background: #2a2e3d; border-radius: 3px; overflow: hidden; margin-top: 2px; }
.bar-fill { height: 100%; background: #ffd700; border-radius: 3px; }
.rec-box { background: #232838; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
.rec-box .label { font-size: 12px; color: #aaa; margin-bottom: 6px; }
.pick-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.badge { display: inline-block; background: #2a6e3f; color: #7dffa8; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
.hit { color: #7dffa8; font-weight: 700; }
.miss { color: #ff6b6b; font-weight: 700; }
.status { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
.status-ok { background: #2a6e3f; color: #7dffa8; }
.status-info { background: #3a3f55; color: #b8c0ff; }
</style>
</head>
<body>
<h1>🎱 六合彩數據分析</h1>
<div class="sub" id="subtitle">載入中…</div>

<div class="grid">
  <!-- 最新開獎 -->
  <div class="card">
    <h2>📅 最新開獎</h2>
    <div id="last-draw" style="text-align:center; padding: 10px 0;">—</div>
    <div style="margin-top:8px; font-size:13px; color:#888;">
      總共 <b id="total-draws" style="color:#ffd700">—</b> 期數據
      (<span id="first-draw">—</span> 至 <span id="last-draw-no">—</span>)
    </div>
  </div>

  <!-- 5年熱門號碼 -->
  <div class="card">
    <h2>🔥 5年最熱號碼</h2>
    <div id="hot-nums" style="text-align:center; padding: 6px 0;">—</div>
    <div id="hot-table"></div>
  </div>

  <!-- 5年最冷號碼 -->
  <div class="card">
    <h2>🧊 5年最冷號碼</h2>
    <div id="cold-nums" style="text-align:center; padding: 6px 0;">—</div>
    <div id="cold-table"></div>
  </div>

  <!-- 特別號 -->
  <div class="card">
    <h2>⭐ 特別號最旺</h2>
    <div id="special-nums" style="text-align:center; padding: 6px 0;">—</div>
  </div>

  <!-- 奇偶分佈 -->
  <div class="card">
    <h2>⚖️ 奇偶分佈</h2>
    <div id="odd-even"></div>
  </div>

  <!-- 大小分佈 -->
  <div class="card">
    <h2>📏 大小分佈</h2>
    <div id="size-dist"></div>
  </div>

  <!-- 尾數 -->
  <div class="card">
    <h2>🔢 尾數分佈</h2>
    <div id="tail-dist"></div>
  </div>

  <!-- 共現對 -->
  <div class="card">
    <h2>🤝 最強共現對</h2>
    <div id="cooccur"></div>
  </div>

  <!-- 推薦 -->
  <div class="card" style="grid-column: 1 / -1;">
    <h2>🎯 最新推薦 (26/084)</h2>
    <div id="recommend">—</div>
  </div>

  <!-- 驗證記錄 -->
  <div class="card" style="grid-column: 1 / -1;">
    <h2>📋 開獎驗證記錄</h2>
    <div id="check-history">未有記錄</div>
  </div>
</div>

<script>
async function api(path) {
  const r = await fetch(path);
  return r.json();
}

function ball(n, cls) {
  return `<span class="ball ${cls}">${n}</span>`;
}

function renderBars(container, data, maxCount) {
  let html = '<table>';
  for (const [label, count] of data) {
    const pct = maxCount ? (count / maxCount * 100).toFixed(0) : 0;
    html += `<tr><td style="text-align:left;width:60px">${label}</td>
             <td style="width:120px"><div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div></td>
             <td style="width:50px">${count}期</td></tr>`;
  }
  html += '</table>';
  container.innerHTML = html;
}

async function load() {
  const stats = await api('/api/stats');
  const co = await api('/api/cooccur');
  const rec = await api('/api/recommend');
  const check = await api('/api/check');

  document.getElementById('subtitle').innerHTML =
    `自動更新 · 最新: ${stats.last_draw} (${stats.last_date}) · 每週二四六開獎後刷新`;

  // 最新開獎
  let balls = '';
  stats.last_numbers.forEach(n => balls += ball(n, 'ball-red'));
  balls += '<span style="margin:0 6px;color:#666">+</span>' + ball(stats.last_special, 'ball-sp');
  document.getElementById('last-draw').innerHTML = balls;
  document.getElementById('total-draws').textContent = stats.total_draws;
  document.getElementById('first-draw').textContent = stats.first_draw;
  document.getElementById('last-draw-no').textContent = stats.last_draw;

  // 熱門
  let hot = '';
  stats.freq_top.slice(0, 8).forEach(x => hot += ball(x.num, 'ball-red'));
  document.getElementById('hot-nums').innerHTML = hot;
  let hotHtml = '<table><tr><th>號碼</th><th>次數</th><th></th></tr>';
  stats.freq_top.forEach(x => {
    const pct = (x.count / stats.freq_top[0].count * 100).toFixed(0);
    hotHtml += `<tr><td>${x.num}</td><td>${x.count}</td><td style="width:100px"><div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div></td></tr>`;
  });
  hotHtml += '</table>';
  document.getElementById('hot-table').innerHTML = hotHtml;

  // 冷門
  let cold = '';
  stats.freq_bottom.slice(0, 8).forEach(x => cold += ball(x.num, 'ball-blue'));
  document.getElementById('cold-nums').innerHTML = cold;
  let coldHtml = '<table><tr><th>號碼</th><th>次數</th></tr>';
  stats.freq_bottom.forEach(x => coldHtml += `<tr><td>${x.num}</td><td>${x.count}</td></tr>`);
  coldHtml += '</table>';
  document.getElementById('cold-table').innerHTML = coldHtml;

  // 特別號
  let sp = '';
  stats.special_top.slice(0, 6).forEach(x => sp += ball(x.num, 'ball-sp') + `<span style="font-size:11px;color:#888;margin-right:6px">${x.count}</span>`);
  document.getElementById('special-nums').innerHTML = sp;

  // 奇偶 / 大小
  const oeMax = stats.odd_even[0][1];
  renderBars(document.getElementById('odd-even'), stats.odd_even, oeMax);
  const sdMax = stats.size[0][1];
  renderBars(document.getElementById('size-dist'), stats.size, sdMax);

  // 尾數
  const tailMax = stats.tail[0][1];
  renderBars(document.getElementById('tail-dist'), stats.tail, tailMax);

  // 共現
  let coHtml = '<table><tr><th>號碼對</th><th>共現次數</th></tr>';
  co.pairs.forEach(p => {
    const [a, b] = p.pair.split(',').map(Number);
    coHtml += `<tr><td>${ball(a,'ball-red')} ${ball(b,'ball-red')}</td><td style="font-weight:700">${p.count}</td></tr>`;
  });
  coHtml += '</table>';
  document.getElementById('cooccur').innerHTML = coHtml;

  // 推薦
  if (rec.latest) {
    const r = rec.latest;
    let html = `<div class="rec-box"><div class="label">🎯 複式主炮 (8字 · $280) — 目標 ${r.target_draw}</div>
                <div class="pick-line">${r.main8.map(n => ball(n,'ball-red')).join('')}</div></div>`;
    html += `<div class="rec-box"><div class="label">🛡️ 複式副炮 (7字 · $70)</div>
             <div class="pick-line">${r.sub7.map(n => ball(n,'ball-blue')).join('')}</div></div>`;
    document.getElementById('recommend').innerHTML = html;
  } else {
    document.getElementById('recommend').innerHTML = '<div style="color:#888">未有推薦 — 等開獎後自動產生</div>';
  }

  // 驗證記錄
  if (check.results.length) {
    let html = '<table><tr><th>期數</th><th>開獎號碼</th><th>結果</th></tr>';
    [...check.results].reverse().forEach(r => {
      const ballsHtml = r.actual_main.map(n => ball(n,'ball-red')).join('');
      const status = r.winning_entries > 0
        ? `<span class="status status-ok">✅ 中 ${r.winning_entries} 注</span>`
        : `<span class="status status-info">❌ 冇中</span>`;
      html += `<tr><td>${r.draw}</td><td>${ballsHtml}</td><td>${status}</td></tr>`;
    });
    html += '</table>';
    document.getElementById('check-history').innerHTML = html;
  }
}

load();
</script>
</body>
</html>
