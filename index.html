<html lang="zh-HK">

    <meta charset="UTF-8" />

    <title>六合彩大數據分析</title>
    <meta name="description" content="六合彩大數據分析 — 25年開獎紀錄、熱門冷門號碼、走勢圖、選號器、統計預測、膽拖計算器。數據每日自動更新，唔使安裝。" />
    <meta name="theme-color" id="theme-meta" content="#f5f5f7" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./pwa-192.png" />
    <script>
      // 預載主題 (防 FOUC 閃白底): 喺 CSS/React mount 前就設定 data-theme
      (function () {
        try {
          var saved = localStorage.getItem('ms-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            var meta = document.getElementById('theme-meta');
            if (meta) meta.content = '#000000';
          }
        } catch (e) {}
      })();
    </script>
