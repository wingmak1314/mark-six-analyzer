name: 自動更新六合彩數據

# ⚠️ GitHub Actions schedule 有延遲/skip 嘅已知 limitation (2026-08-27 26/094 + 2026-08-29 26/095 都漏咗)
# 解決: 每個鐘跑一次 — update_data.py 係冪等 (已最新就唔 commit), 所以唔會重複 commit
# 開獎日 21:30 攪珠 → 下一個正點 (22:00) 必補到, 就算 skip 幾次都追得返
on:
  schedule:
    - cron: '0 * * * *'   # 每個鐘正點跑一次
  workflow_dispatch:  # 可以手動觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 抓取 lottery.hk 最新數據
        timeout-minutes: 5
        run: python scripts/update_data.py

      - name: Commit + Push (有更新先 commit)
        run: |
          if ! git diff --quiet history_full.json payouts.json; then
            git config user.name "marksix-bot"
            git config user.email "marksix-bot@users.noreply.github.com"
            git add history_full.json payouts.json
            git commit -m "data: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 同 frontend bot 有機會同時 commit — push 前先 rebase, 避免 push 失敗
            git pull --rebase origin main
            git push
            echo "✅ 數據已更新"
          else
            echo "✅ 已係最新, 無需更新"
          fi
