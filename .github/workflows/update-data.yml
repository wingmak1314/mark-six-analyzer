name: 每日更新六合彩數據

# 開獎日 (二四六) 21:30 攪珠 → 21:35 即時更新 (13:35 UTC)
# 其他日子 21:50 保險檢查 (13:50 UTC)
on:
  schedule:
    - cron: '35 13 * * 2,4,6'   # 二四六 21:35 香港時間 (開獎後即刻)
    - cron: '50 13 * * *'       # 每日 21:50 香港時間 (保險)
  workflow_dispatch:  # 可以手動觸發

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取 lottery.hk 最新數據
        run: python scripts/update_data.py

      - name: Commit + Push (有更新先 commit)
        run: |
          if ! git diff --quiet history_full.json; then
            git config user.name "marksix-bot"
            git config user.email "marksix-bot@users.noreply.github.com"
            git add history_full.json
            git commit -m "data: auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ 數據已更新"
          else
            echo "✅ 已係最新, 無需更新"
          fi
